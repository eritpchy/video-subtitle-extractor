name: Complete Python source inference validation

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      reuse_qt_overlay_resources:
        description: Internal caller completed the same-run fixed Qt resource job
        type: boolean
        default: false
      reuse_original_models:
        description: Internal caller already completed this run's fixed model seed job
        type: boolean
        default: false
    outputs:
      acceptance_artifact:
        value: ${{ jobs.source-set.outputs.acceptance_artifact }}
      acceptance_sha256:
        value: ${{ jobs.source-set.outputs.acceptance_sha256 }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: python-source-${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  qt-overlay-resources:
    if: ${{ !inputs.reuse_qt_overlay_resources }}
    uses: ./.github/workflows/qt-overlay-resources.yml
    permissions:
      contents: read
      actions: read

  source:
    needs: qt-overlay-resources
    if: ${{ !cancelled() && (needs.qt-overlay-resources.result == 'success' || (inputs.reuse_qt_overlay_resources && needs.qt-overlay-resources.result == 'skipped')) }}
    name: Clean Python 3.12 / ${{ matrix.name }} / no custom worker
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux explicit CPU
            architecture: x64
            provider: cpu
            profile: linux-ort-cpu
          - os: macos-26
            name: macOS explicit CPU and CoreML
            architecture: arm64
            provider: both
            profile: macos-ort-cpu-coreml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      ORT_DISABLE_TELEMETRY: '1'
      QT_QPA_PLATFORM: ${{ matrix.os == 'macos-26' && 'cocoa' || 'offscreen' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - name: Install Linux Qt runtime libraries, not an OCR compiler
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libgl1 libegl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 libfontconfig1
          libfreetype6 libx11-6 libx11-xcb1 libxext6 libxrender1 libxi6 libxfixes3
          libsm6 libice6 libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1
          libxcb-image0 libxcb-util1 libxcb-randr0 libxcb-render0 libxcb-render-util0
          libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1
          libxcb-glx0 libxkbcommon-x11-0
      - name: Create a new interpreter environment and empty user cache
        run: |
          mkdir -p "$RUNNER_TEMP/python-source-home" test-results
          python scripts/source_ci_steps.py init --evidence test-results/python-source \
            --profile ${{ matrix.profile }} --venv "$RUNNER_TEMP/python-source-venv" \
            --models "$GITHUB_WORKSPACE/build/source-models"
          echo "$RUNNER_TEMP/python-source-venv/bin" >> "$GITHUB_PATH"
          echo "HOME=$RUNNER_TEMP/python-source-home" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/python-source-home/cache" >> "$GITHUB_ENV"
      - name: Prove the fresh interpreter starts without host loader overrides
        run: |
          python - <<'PY'
          import json, os, pathlib, re, subprocess
          removed = sorted(name for name in os.environ if name.startswith(('LD_', 'DYLD_')))
          if any(not re.fullmatch('[A-Z][A-Z0-9_]*', name) for name in removed):
              raise RuntimeError('Invalid loader environment variable name')
          clean = {name: value for name, value in os.environ.items() if name not in removed}
          interpreter = pathlib.Path(os.environ['RUNNER_TEMP']) / 'python-source-venv/bin/python'
          code = "import json,os,sys; remaining={k:v for k,v in os.environ.items() if k.startswith(('LD_','DYLD_')) and v}; assert not remaining,remaining; print(json.dumps({'interpreter':sys.executable,'prefix':sys.prefix,'version':sys.version,'loader_overrides':remaining}))"
          result = subprocess.run([str(interpreter), '-I', '-c', code], env=clean, check=True, capture_output=True, text=True)
          probe = json.loads(result.stdout)
          if pathlib.Path(probe['prefix']).resolve() != interpreter.parent.parent.resolve():
              raise RuntimeError('Clean loader probe did not run the new virtual environment')
          pathlib.Path('test-results/python-source/clean-interpreter.json').write_text(json.dumps({'removed_loader_variable_names':removed,'probe':probe,'scope':'Clean interpreter startup only; inference is separately required'}, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as target:
              for name in removed:
                  target.write(name + '=\n')
          PY
      - name: Install public Python source dependencies in the new environment
        run: |
          python scripts/source_ci_steps.py run-step --evidence test-results/python-source --step pip-install
          python scripts/source_ci_steps.py run-step --evidence test-results/python-source --step pip-check
          python -m pip freeze > test-results/python-source/pip-freeze.txt
      - name: Retrieve the same fixed Qt candidate resource bytes used by the Mac package
        if: runner.os == 'macOS'
        uses: actions/download-artifact@v4
        with:
          name: qt-overlay-resources-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/qt-overlay-resources
      - name: Explicitly prepare only this new venv's reviewed Qt plugin
        if: runner.os == 'macOS'
        run: python scripts/source_ci_steps.py run-step --evidence test-results/python-source --step qt-overlay
      - name: Check default source dispatch without any inference runtime initialization
        run: python scripts/source_ci_steps.py run-step --evidence test-results/python-source --step source-default
      - name: Unit tests for Python provider, source-only data and evidence contracts
        run: >-
          python -m pytest tests/test_python_coreml*.py tests/test_check_python_coreml.py
          tests/test_prepare_source_models.py tests/test_source_ci_steps.py tests/test_source_acceptance.py
          tests/test_e2e_python_coreml.py tests/test_python_source_workflow.py tests/test_macos_setting_controls.py
          tests/test_home_preview_lifecycle.py
          -q --junitxml=test-results/python-source/contracts.xml
      - name: Restore only the exact immutable public model-data archive
        uses: actions/cache@v4
        with:
          path: build/source-model-downloads
          key: source-model-data-60e6f8098c058777273b5a6820d804731b5c93c45c78b14f5d8d1d1165361a11
      - name: Prepare all 15 ONNX graphs from public data, never a worker dependency
        run: |
          python -S scripts/prepare_source_models.py onnx --output build/source-models --cache build/source-model-downloads
          python scripts/source_ci_steps.py run-step --evidence test-results/python-source --step models-verify
      - name: Install and verify the unchanged third-party video tool
        run: |
          python scripts/install_videosubfinder.py --version 6.10.7
          python scripts/source_ci_steps.py run-step --evidence test-results/python-source --step vsf-verify
      - name: Select the complete Python inference backend, not the native distribution
        run: |
          echo "VSE_OCR_BACKEND=python-coreml" >> "$GITHUB_ENV"
          echo "VSE_PYTHON_COREML_MODEL_ROOT=$GITHUB_WORKSPACE/build/source-models" >> "$GITHUB_ENV"
          echo "VSE_NATIVE_OCR_ROOT=$RUNNER_TEMP/absent-native-worker" >> "$GITHUB_ENV"
          echo "VSE_OFFLINE=1" >> "$GITHUB_ENV"
      - name: Real Python GUI startup and CLI entrypoint
        run: |
          python scripts/source_ci_steps.py run-step --evidence test-results/python-source --step gui-smoke
          python scripts/source_ci_steps.py run-step --evidence test-results/python-source --step cli-version
          python scripts/source_ci_steps.py run-step --evidence test-results/python-source --step cli-help
      - name: Actual Python CoreML small and medium compatibility before wider coverage
        if: runner.os == 'macOS'
        run: >-
          python scripts/check_python_coreml.py --models build/source-models
          --fixtures native/ocr/tests/evidence --provider coreml --case-set early
          --report test-results/python-source/coreml-early.json
      - name: Actual Python CoreML execution of every fixed model
        if: runner.os == 'macOS'
        run: >-
          python scripts/check_python_coreml.py --models build/source-models
          --fixtures native/ocr/tests/evidence --provider coreml --case-set models
          --report test-results/python-source/coreml-models.json
      - name: All 168 cases across three production modes on explicit Python CPU
        run: >-
          python scripts/source_ci_steps.py run-step --evidence test-results/python-source --step image-cpu
      - name: All 168 cases across three production modes on Python CoreML
        if: runner.os == 'macOS'
        run: >-
          python scripts/source_ci_steps.py run-step --evidence test-results/python-source --step image-coreml
      - name: Real source CLI video to SRT in all modes with same-video provider comparison
        run: >-
          python scripts/source_ci_steps.py run-step --evidence test-results/python-source --step video
      - name: Bind successful source steps and raw inference to this exact run
        run: python scripts/source_acceptance.py produce --evidence test-results/python-source
      - name: Preserve source evidence including genuine failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-evidence-${{ matrix.profile }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/python-source/
          if-no-files-found: warn
          retention-days: 14
      - name: Keep source, native distribution and GPU proof separate
        if: always()
        run: |
          echo 'This validates Python application source with standard third-party libraries and VSF, not a claim that Qt/ORT/FFmpeg are implemented in Python.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No custom OCR worker or C++ build is used. CoreML execution evidence is not physical GPU, timing or final distribution certification.' >> "$GITHUB_STEP_SUMMARY"


  original-models:
    if: ${{ !inputs.reuse_original_models }}
    # CI reuses already accepted original data; source users use public model URLs.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/paddle-models.yml

  windows-source-cuda:
    name: Windows Server 2022 / Python source CUDA ${{ matrix.cuda }} / explicit CPU acceptance
    needs: original-models
    # A main-workflow caller must itself need the successful original-models
    # job before requesting reuse. The consumer still verifies same-run bytes.
    if: ${{ !cancelled() && (needs.original-models.result == 'success' || (inputs.reuse_original_models && needs.original-models.result == 'skipped')) }}
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - cuda: '11.8'
            requirements: requirements-source-cuda118.txt
          - cuda: '12.6'
            requirements: requirements-source-cuda126.txt
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: windows
      VSE_OCR_BACKEND: paddle
      VSE_MODEL_DIR: ${{ github.workspace }}/build/paddle-seed/models
      VSE_NATIVE_OCR_ROOT: ${{ github.workspace }}/build/absent-native-worker
      VSE_OFFLINE: '1'
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Create a distinct empty Python source virtual environment
        run: |
          mkdir -p test-results
          python scripts/source_ci_steps.py init --evidence test-results/python-source-cuda \
            --profile windows-cuda${{ matrix.cuda }} --venv "$RUNNER_TEMP/cuda-source-venv" \
            --models "$GITHUB_WORKSPACE/build/paddle-seed/models"
          echo "$RUNNER_TEMP/cuda-source-venv/Scripts" >> "$GITHUB_PATH"
      - name: Ordinary source pip install, not distribution meta-package substitution
        run: |
          python scripts/source_ci_steps.py run-step --evidence test-results/python-source-cuda --step pip-install
          python scripts/source_ci_steps.py run-step --evidence test-results/python-source-cuda --step pip-check
          python -m pip freeze > test-results/python-source-cuda/pip-freeze.txt
      - name: Verify exact whole-wheel identity and genuine CUDA build, while selecting CPU
        run: >-
          python scripts/source_ci_steps.py run-step --evidence test-results/python-source-cuda --step cuda-environment
      - name: Source dependency and fail-closed environment contracts
        run: >-
          python -m pytest tests/test_source_cuda_requirements.py tests/test_source_cuda_environment.py
          tests/test_python_source_workflow.py tests/test_paddle_package_models.py
          tests/test_check_paddle_models.py tests/test_e2e_modes.py
          tests/test_source_ci_steps.py tests/test_source_acceptance.py tests/test_home_preview_lifecycle.py -q
          --junitxml=test-results/python-source-cuda/contracts.xml
      - name: Download this run's independently verified original-model seed
        uses: actions/download-artifact@v4
        with:
          name: paddle-original-models-${{ github.sha }}
          path: build/paddle-seed
      - name: Recheck all source model bytes without any model-origin request
        run: |
          python scripts/paddle_model_seed_ci.py --verify-seed build/paddle-seed
          python scripts/source_ci_steps.py run-step --evidence test-results/python-source-cuda --step models-verify
      - name: Verify the unchanged VSF release and absence of a project OCR worker
        run: |
          python scripts/install_videosubfinder.py --version 6.10.7
          python scripts/source_ci_steps.py run-step --evidence test-results/python-source-cuda --step vsf-verify
          python scripts/source_ci_steps.py run-step --evidence test-results/python-source-cuda --step source-default
      - name: Actual Python GUI startup and CLI entrypoint
        run: |
          python scripts/source_ci_steps.py run-step --evidence test-results/python-source-cuda --step gui-smoke
          python scripts/source_ci_steps.py run-step --evidence test-results/python-source-cuda --step cli-version
          python scripts/source_ci_steps.py run-step --evidence test-results/python-source-cuda --step cli-help
      - name: All 15 original models and 168 real source CPU cases in all three modes
        run: >-
          python scripts/source_ci_steps.py run-step --evidence test-results/python-source-cuda --step image-cpu
      - name: Actual source CLI video extraction in all three modes, explicitly CPU
        run: >-
          python scripts/source_ci_steps.py run-step --evidence test-results/python-source-cuda --step video
      - name: Bind successful Python CUDA source evidence without GPU certification
        run: python scripts/source_acceptance.py produce --evidence test-results/python-source-cuda
      - name: Preserve source CUDA evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-evidence-windows-cuda${{ matrix.cuda }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/python-source-cuda/
          if-no-files-found: warn
          retention-days: 14
      - name: Keep compiled CUDA identity and real GPU execution distinct
        if: always()
        run: |
          echo 'Fresh ordinary-pip Python source environment; no project C++ worker or package bootstrap. Every OCR gate explicitly selects CPU.' >> "$GITHUB_STEP_SUMMARY"
          echo 'CUDA wheel identity is not GPU hardware/OCR certification. Client one-click packages remain a separate acceptance chain.' >> "$GITHUB_STEP_SUMMARY"

  source-set:
    name: Verify the complete same-commit Python source evidence set
    needs: [source, windows-source-cuda]
    # The reusable caller intentionally skips the duplicate seed producer.
    # Override ancestor-skip propagation, never either real source matrix's
    # success requirement; a cancelled/failed/skipped source job cannot pass.
    if: ${{ !cancelled() && needs.source.result == 'success' && needs.windows-source-cuda.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      acceptance_artifact: ${{ steps.receipt.outputs.acceptance_artifact }}
      acceptance_sha256: ${{ steps.receipt.outputs.acceptance_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: source-evidence-linux-ort-cpu-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/source-evidence/linux-ort-cpu
      - uses: actions/download-artifact@v4
        with:
          name: source-evidence-macos-ort-cpu-coreml-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/source-evidence/macos-ort-cpu-coreml
      - uses: actions/download-artifact@v4
        with:
          name: source-evidence-windows-cuda11.8-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/source-evidence/windows-cuda11.8
      - uses: actions/download-artifact@v4
        with:
          name: source-evidence-windows-cuda12.6-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/source-evidence/windows-cuda12.6
      - name: Revalidate every original report and actual command before aggregation
        run: >-
          python -I -S scripts/source_acceptance.py aggregate --evidence-root build/source-evidence
          --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --output build/source-acceptance.json
      - name: Bind the independently rechecked source artifact to this caller
        id: receipt
        run: |
          python - <<'PY'
          import hashlib, os, pathlib
          path = pathlib.Path('build/source-acceptance.json')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('acceptance_artifact=source-acceptance-' + os.environ['GITHUB_SHA'] + '-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '\n')
              output.write('acceptance_sha256=' + hashlib.sha256(path.read_bytes()).hexdigest() + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.receipt.outputs.acceptance_artifact }}
          path: build/source-acceptance.json
          if-no-files-found: error
          retention-days: 14
