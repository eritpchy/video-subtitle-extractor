name: Cross-platform CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  QT_QPA_PLATFORM: offscreen
  PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
  VSE_RUN_OCR_INTEGRATION: '1'
  VSE_RUN_VSF_INTEGRATION: '1'

jobs:
  native:
    name: CPU / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux x64
          - os: windows-2022
            name: Windows x64
          - os: macos-15
            name: macOS arm64
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: ${{ matrix.os == 'macos-15' && 'cocoa' || 'offscreen' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libgl1 libegl1 libglib2.0-0 libdbus-1-3 libxkbcommon0
          libfontconfig1 libfreetype6 libx11-6 libx11-xcb1 libxext6 libxrender1
          libxi6 libxfixes3 libsm6 libice6
          libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0
          libxcb-util1 libxcb-randr0 libxcb-render0 libxcb-render-util0
          libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1
          libxcb-glx0 libxkbcommon-x11-0 xvfb xauth
      - name: Install CPU runtime and test dependencies
        run: python -m pip install -r requirements.txt pytest==8.3.5
      - name: Check dependency consistency
        run: python -m pip check
      - name: Install verified VideoSubFinder CPU release
        run: python scripts/install_videosubfinder.py --version 6.10
      - name: Verify native VideoSubFinder
        run: python scripts/install_videosubfinder.py --verify-only
      - name: Download and verify small and medium PP-OCRv6 models
        run: python -m backend.tools.model_download --tiers small medium --output backend/models/V6
      - name: Unit, GUI, model and real CPU OCR tests
        timeout-minutes: 12
        run: python -m pytest tests -vv --capture=tee-sys -o faulthandler_timeout=120 --durations=20 --junitxml=test-results/native.xml
      - name: Launch actual GUI with platform-safe Qt backend
        env:
          VSE_SMOKE_SCREENSHOT_DIR: test-results/gui
        run: python gui.py --smoke-test
      - name: Diagnose Linux Qt platform dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p test-results
          python scripts/diagnose_qt_linux.py 2>&1 | tee test-results/qt-linux-dependencies.log
      - name: Linux X11 GUI backend smoke
        if: runner.os == 'Linux'
        shell: bash
        env:
          VSE_SMOKE_SCREENSHOT_DIR: test-results/gui-native
          QT_DEBUG_PLUGINS: '1'
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" -e test-results/xvfb.log \
            env QT_QPA_PLATFORM=xcb python gui.py --smoke-test 2>&1 | tee test-results/gui-native.log
      - name: Windows or macOS native GUI backend smoke
        if: runner.os != 'Linux'
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'macOS' && 'cocoa' || 'windows' }}
          VSE_SMOKE_SCREENSHOT_DIR: test-results/gui-native
        run: python gui.py --smoke-test
      - name: CLI entrypoint
        run: python -m backend.cli --help
      - name: Native video-to-SRT end-to-end regression
        env:
          VSE_OFFLINE: '1'
        run: python scripts/e2e_smoke.py --output test-results/e2e
      - name: Issue-targeted multiline, AV1 and timeline end-to-end regressions
        env:
          VSE_OFFLINE: '1'
        run: python scripts/e2e_issues.py --output test-results/issues
      - name: Publish test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: warn

  docker:
    name: Docker CPU / Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build CPU image (never push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: vse-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check CLI version and help
        env:
          IMAGE: vse-ci:${{ github.sha }}
        run: |
          docker run --rm "$IMAGE" --version
          docker run --rm "$IMAGE" --help
      - name: CPU extraction end-to-end in container
        env:
          IMAGE: vse-ci:${{ github.sha }}
        run: |
          mkdir -p test-results
          docker run --name vse-e2e --network none -e VSE_OFFLINE=1 --entrypoint python "$IMAGE" scripts/e2e_smoke.py --output /tmp/vse-e2e
          docker cp vse-e2e:/tmp/vse-e2e test-results/docker-e2e
      - name: Issue-targeted regressions in offline container
        env:
          IMAGE: vse-ci:${{ github.sha }}
        run: |
          docker run --name vse-issues --network none -e VSE_OFFLINE=1 --entrypoint python "$IMAGE" scripts/e2e_issues.py --output /tmp/vse-issues
          docker cp vse-issues:/tmp/vse-issues test-results/docker-issues
      - name: Capture Docker logs and cleanup
        if: always()
        run: |
          mkdir -p test-results
          docker logs vse-e2e > test-results/docker.log 2>&1 || true
          docker cp vse-e2e:/tmp/vse-e2e test-results/docker-e2e 2>/dev/null || true
          docker rm -f vse-e2e 2>/dev/null || true
          docker logs vse-issues > test-results/docker-issues.log 2>&1 || true
          docker cp vse-issues:/tmp/vse-issues test-results/docker-issues 2>/dev/null || true
          docker rm -f vse-issues 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-docker
          path: test-results/
          if-no-files-found: warn
