name: Cross-platform CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  QT_QPA_PLATFORM: offscreen
  PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
  VSE_RUN_OCR_INTEGRATION: '1'
  VSE_RUN_VSF_INTEGRATION: '1'

jobs:
  original-models:
    uses: ./.github/workflows/paddle-models.yml

  native:
    name: Paddle CPU / ${{ matrix.name }}
    needs: original-models
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux x64
          - os: windows-2022
            name: Windows Server 2022 x64
          - os: windows-2025
            name: Windows Server 2025 x64
          - os: macos-26
            name: macOS arm64
    runs-on: ${{ matrix.os }}
    env:
      VSE_MODEL_DIR: ${{ github.workspace }}/build/paddle-seed/models
      QT_QPA_PLATFORM: ${{ matrix.os == 'macos-26' && 'cocoa' || 'offscreen' }}
    # Each native platform repeats full launcher acceptance under two host environments.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          architecture: ${{ runner.os == 'macOS' && 'arm64' || 'x64' }}
      - name: Record actual Windows OS build and process architecture
        id: windows-identity
        if: runner.os == 'Windows'
        run: python scripts/windows_verification.py capture --runner ${{ matrix.os }} --profile paddle
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libgl1 libegl1 libglib2.0-0 libdbus-1-3 libxkbcommon0
          libfontconfig1 libfreetype6 libx11-6 libx11-xcb1 libxext6 libxrender1
          libxi6 libxfixes3 libsm6 libice6
          libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0
          libxcb-util1 libxcb-randr0 libxcb-render0 libxcb-render-util0
          libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1
          libxcb-glx0 libxkbcommon-x11-0 xvfb xauth
      - name: Install CPU runtime and test dependencies
        run: python -m pip install -r requirements.txt pytest==8.3.5
      - name: Check dependency consistency
        run: python -m pip check
      - name: Install verified VideoSubFinder CPU release
        run: python scripts/install_videosubfinder.py --version 6.10.7
      - name: Verify native VideoSubFinder
        run: python scripts/install_videosubfinder.py --verify-only
      - name: Download this run's complete pinned original models (no origin request)
        uses: actions/download-artifact@v4
        with:
          name: paddle-original-models-${{ github.sha }}
          path: build/paddle-seed
      - name: Verify original model bytes and accepted source identity offline
        run: python scripts/paddle_model_seed_ci.py --verify-seed build/paddle-seed
      - name: Unit, GUI, model and real CPU OCR tests
        id: source-tests
        timeout-minutes: 12
        run: python -m pytest tests -vv --capture=tee-sys -o faulthandler_timeout=120 --durations=20 --junitxml=test-results/native.xml
      - name: Restorer source and build-gate contracts on native Server
        if: runner.os == 'Windows'
        run: >-
          python -m pytest
          native/windows-restorer/tests/test_source_bundle.py
          native/windows-restorer/tests/test_release_gate.py
          native/windows-restorer/tests/test_metadata.py
          native/windows-restorer/tests/test_zip_layout.py
          native/windows-restorer/tests/test_space_preflight_isolation.py
          -vv --junitxml=test-results/restorer-contracts.xml
      - name: Launch actual GUI with platform-safe Qt backend
        env:
          VSE_SMOKE_SCREENSHOT_DIR: test-results/gui
        run: python gui.py --smoke-test
      - name: Diagnose Linux Qt platform dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          python scripts/diagnose_qt_linux.py 2>&1 | tee test-results/qt-linux-dependencies.log
      - name: Linux X11 GUI backend smoke
        if: runner.os == 'Linux'
        shell: bash
        env:
          VSE_SMOKE_SCREENSHOT_DIR: test-results/gui-native
          QT_DEBUG_PLUGINS: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x1024x24" -e test-results/xvfb.log \
            env QT_QPA_PLATFORM=xcb python gui.py --smoke-test 2>&1 | tee test-results/gui-native.log
      - name: Windows or macOS native GUI backend smoke
        id: windows-gui
        if: runner.os != 'Linux'
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'macOS' && 'cocoa' || 'windows' }}
          VSE_SMOKE_SCREENSHOT_DIR: test-results/gui-native
          VSE_CI_WINDOWS_SYSTEM_THEME: ${{ runner.os == 'Windows' && '1' || '0' }}
          VSE_CI_WINDOWS_RUNNER: ${{ matrix.os }}
        run: python gui.py --smoke-test
      - name: Windows native-backend light, dark and system-theme flows
        id: windows-theme
        if: runner.os == 'Windows'
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: windows
        run: >-
          python -m pytest tests/test_theme.py tests/test_theme_system_flows.py -vv
          --junitxml=test-results/windows-theme.xml
      - name: CLI entrypoint
        id: cli
        run: python -m backend.cli --help
      - name: Native video-to-SRT end-to-end regression
        id: ordinary
        env:
          VSE_OFFLINE: '1'
        run: python scripts/e2e_smoke.py --output test-results/e2e
      - name: Issue-targeted multiline, AV1 and timeline end-to-end regressions
        id: issues
        env:
          VSE_OFFLINE: '1'
        run: python scripts/e2e_issues.py --output test-results/issues
      - name: Resolve native inference bundle wheels
        run: python -m pip wheel -r requirements.txt -r requirements-inference.txt pytest==8.3.5 --wheel-dir build/wheelhouse
      - name: Build self-contained inference distribution
        id: package-build
        run: |
          python scripts/paddle_model_seed_ci.py --verify-seed build/paddle-seed
          python scripts/package_release.py --paddle-models build/paddle-seed/models --wheelhouse build/wheelhouse --output dist-ci
      - name: Verify self-contained Linux distribution with native X11
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a -s "-screen 0 1280x1024x24" env QT_QPA_PLATFORM=xcb python scripts/package_release.py --verify dist-ci --smoke
      - name: Verify self-contained Windows or macOS distribution
        id: package-verify
        if: runner.os != 'Linux'
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'macOS' && 'cocoa' || 'windows' }}
        run: python scripts/package_release.py --verify dist-ci --smoke
      - name: Windows actual launcher with clean PATH and contaminated host environment
        id: portable-environment
        if: success() && runner.os == 'Windows'
        timeout-minutes: 35
        env:
          QT_QPA_PLATFORM: windows
          VSE_WINDOWS_RUNNER_LABEL: ${{ matrix.os }}
        run: python scripts/verify_portable_environment.py --archives dist-ci --output test-results/windows/portable-environment
      - name: Linux actual launcher with clean PATH and contaminated host environment under X11
        id: portable-environment-linux
        if: success() && runner.os == 'Linux'
        timeout-minutes: 35
        shell: bash
        run: >-
          xvfb-run -a -s "-screen 0 1280x1024x24" env QT_QPA_PLATFORM=xcb
          python scripts/verify_portable_environment.py --archives dist-ci
          --output test-results/linux/portable-environment
      - name: macOS command and app launchers with clean PATH and contaminated host environment
        id: portable-environment-macos
        if: success() && runner.os == 'macOS'
        timeout-minutes: 35
        env:
          QT_QPA_PLATFORM: cocoa
        run: python scripts/verify_portable_environment.py --archives dist-ci --output test-results/macos/portable-environment
      - name: Verify Linux package without host Python or native libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for archive in dist-ci/*linux-x64-cpu*.zip; do
            python scripts/verify_clean_linux_bundle.py --archive "$archive" --output test-results/clean-linux
          done
      - name: Report Windows coverage including failed and skipped stages
        if: always() && runner.os == 'Windows'
        env:
          VSE_WINDOWS_STEP_OUTCOMES: >-
            {"identity":"${{ steps.windows-identity.outcome }}",
             "source-tests":"${{ steps.source-tests.outcome }}",
             "gui":"${{ steps.windows-gui.outcome }}",
             "theme":"${{ steps.windows-theme.outcome }}",
             "system-theme":"${{ steps.windows-gui.outcome }}",
             "cli":"${{ steps.cli.outcome }}",
             "ordinary":"${{ steps.ordinary.outcome }}",
             "issues":"${{ steps.issues.outcome }}",
             "package-build":"${{ steps.package-build.outcome }}",
             "package-verify":"${{ steps.package-verify.outcome }}",
             "portable-environment":"${{ steps.portable-environment.outcome }}"}
        run: >-
          python scripts/windows_verification.py summarize --runner ${{ matrix.os }} --profile paddle
          --system-theme-report test-results/gui-native/system-theme.json
      - name: Preserve inference distribution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paddle-inference-package-results-${{ matrix.os }}-${{ runner.arch }}
          path: dist-ci/test-results/
          if-no-files-found: warn
      - name: Publish test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paddle-test-results-${{ matrix.os }}-${{ runner.arch }}
          path: test-results/
          if-no-files-found: warn

  docker:
    name: Docker CPU / Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build CPU image (never push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: vse-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check CLI version and help
        env:
          IMAGE: vse-ci:${{ github.sha }}
        run: |
          docker run --rm "$IMAGE" --version
          docker run --rm "$IMAGE" --help
      - name: CPU extraction end-to-end in container
        env:
          IMAGE: vse-ci:${{ github.sha }}
        run: |
          mkdir -p test-results
          docker run --name vse-e2e --network none -e VSE_OFFLINE=1 --entrypoint python "$IMAGE" scripts/e2e_smoke.py --output /tmp/vse-e2e
          docker cp vse-e2e:/tmp/vse-e2e test-results/docker-e2e
      - name: Issue-targeted regressions in offline container
        env:
          IMAGE: vse-ci:${{ github.sha }}
        run: |
          docker run --name vse-issues --network none -e VSE_OFFLINE=1 --entrypoint python "$IMAGE" scripts/e2e_issues.py --output /tmp/vse-issues
          docker cp vse-issues:/tmp/vse-issues test-results/docker-issues
      - name: Capture Docker logs and cleanup
        if: always()
        run: |
          mkdir -p test-results
          docker logs vse-e2e > test-results/docker.log 2>&1 || true
          docker cp vse-e2e:/tmp/vse-e2e test-results/docker-e2e 2>/dev/null || true
          docker rm -f vse-e2e 2>/dev/null || true
          docker logs vse-issues > test-results/docker-issues.log 2>&1 || true
          docker cp vse-issues:/tmp/vse-issues test-results/docker-issues 2>/dev/null || true
          docker rm -f vse-issues 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-docker
          path: test-results/
          if-no-files-found: warn
