name: Automatic one-click package candidates

# Build-only. Never create/move tags or publish/replace release assets.
on:
  push:
    branches: ['**', '!fix/macos-focus-activation']
    paths: ['.gitattributes', '.github/workflows/**', 'native/ocr/**', 'requirements*.txt', 'backend/**', 'ui/**', 'gui.py', 'design/**', 'scripts/**', 'tests/**', 'docs/licenses/**']
  pull_request:
    paths: ['.gitattributes', '.github/workflows/**', 'native/ocr/**', 'requirements*.txt', 'backend/**', 'ui/**', 'gui.py', 'design/**', 'scripts/**', 'tests/**', 'docs/licenses/**']
  workflow_dispatch:
    inputs:
      acknowledge_vc_redistribution_license:
        description: Confirm applicable Microsoft Visual C++ redistributable distribution rights
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: release-candidates-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
  POLYGRAPHY_AUTOINSTALL_DEPS: '0'

jobs:
  qt-overlay-resources:
    uses: ./.github/workflows/qt-overlay-resources.yml

  original-models:
    uses: ./.github/workflows/paddle-models.yml

  python-source:
    name: Complete Python source from this exact candidate commit
    needs: [original-models, qt-overlay-resources]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/python-source.yml
    with:
      reuse_original_models: true
      reuse_qt_overlay_resources: true

  native:
    name: Native CPU and dual-provider Mac CoreML matrix
    needs: qt-overlay-resources
    uses: ./.github/workflows/native-ocr.yml
    with:
      acknowledge_vc_redistribution_license: ${{ inputs.acknowledge_vc_redistribution_license || false }}
      reuse_qt_overlay_resources: true

  windows-paddle:
    name: ${{ matrix.profile }} / ${{ matrix.os }} (GPU hardware not tested)
    needs: original-models
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        profile: [paddle-cpu, paddle-cuda11.8, paddle-cuda12.6]
        include:
          - profile: paddle-cpu
            accelerator: cpu
          - profile: paddle-cuda11.8
            accelerator: cuda11.8
          - profile: paddle-cuda12.6
            accelerator: cuda12.6
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    env:
      QT_QPA_PLATFORM: windows
      VSE_WINDOWS_RUNNER_LABEL: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build-only packaging and test tools
        run: python -m pip install packaging pytest==8.3.5
      - name: Resolve original CPU or official CUDA wheels without mixing Paddle variants
        run: python scripts/prepare_release_profile.py --profile ${{ matrix.profile }} --output build/wheelhouse
      - name: Install selected untouched build-side wheels
        run: >-
          python -c "import pathlib,subprocess,sys; subprocess.run([sys.executable,'-m','pip','install','--no-index','--no-deps','--no-compile',*map(str,sorted(pathlib.Path('build/wheelhouse').glob('*.whl')))],check=True)"
      - name: Release/profile/launcher safety tests
        run: >-
          python -m pytest tests/test_release_packaging.py tests/test_release_profiles.py
          tests/test_release_guard.py tests/test_release_acceptance.py tests/test_cuda_package.py
          tests/test_cuda_profile_audit.py tests/test_prune_cuda_development.py
          tests/test_runtime_dependencies.py tests/test_portable_environment.py tests/test_e2e_modes.py
          tests/test_paddle_package_models.py tests/test_check_paddle_models.py tests/test_final_paddle_launcher.py
          tests/test_isolated_model_verifier.py tests/test_home_preview_lifecycle.py
          tests/test_frozen_checkout_bytes.py -q --junitxml=test-results/profile-safety.xml
      - name: Install fixed verified VideoSubFinder
        run: python scripts/install_videosubfinder.py --version 6.10.7
      - name: Download this run's complete pinned original models (no origin request)
        uses: actions/download-artifact@v4
        with:
          name: paddle-original-models-${{ github.sha }}
          path: build/paddle-seed
      - name: Verify original model bytes and accepted source identity offline
        run: python scripts/paddle_model_seed_ci.py --verify-seed build/paddle-seed
      - name: Build self-contained package with exact backend identity
        run: >-
          python scripts/package_release.py --profile paddle --accelerator ${{ matrix.accelerator }}
          --paddle-models build/paddle-seed/models --wheelhouse build/wheelhouse --output dist
      - name: Final ZIP launcher, three CPU modes, media and dependency acceptance
        run: python scripts/package_release.py --verify dist --smoke
      - name: Final ZIP under clean PATH and contaminated host environment
        timeout-minutes: 45
        run: python scripts/verify_portable_environment.py --archives dist --output test-results/windows/portable-environment
      - name: Bind passed final-package evidence to exact ZIP bytes
        run: python scripts/accept_release_archive.py --archives dist --portable-evidence test-results/windows/portable-environment
      - name: Preserve final-package evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restored-profile-evidence-${{ matrix.os }}-${{ matrix.profile }}
          path: |
            test-results/
            dist/test-results/
            dist/*.size.json
            dist/*.sha256
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve canonical candidate (Server 2025 independently validates)
        if: matrix.os == 'windows-2022'
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-windows-x64-${{ matrix.profile }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.zip.acceptance.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows-directml:
    name: Original DirectML 1.20.1 / ${{ matrix.os }} (explicit CPU acceptance)
    needs: native
    # Independent profile evidence may proceed after a Native test failure.
    # The same-run SHA-named model artifact must still exist and verify below;
    # candidate-set retains its default success gate for the complete matrix.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: windows
      VSE_WINDOWS_RUNNER_LABEL: ${{ matrix.os }}
      VSE_OCR_BACKEND: directml
      VSE_DIRECTML_MODEL_ROOT: ${{ github.workspace }}/build/native-models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/download-artifact@v4
        with:
          name: native-ocr-fp32-models-${{ github.sha }}
          path: build/native-models
      - name: Reverify every converted graph/config against committed pins
        run: python -S native/ocr/verify_model_cache.py build/native-models --require-provenance
      - run: python -m pip install packaging pytest==8.3.5
      - name: Resolve original ORT DirectML 1.20.1 (no new SDK/client converter)
        run: python scripts/prepare_release_profile.py --profile directml --output build/wheelhouse
      - name: Install untouched selected build-side runtime
        run: >-
          python -c "import pathlib,subprocess,sys; subprocess.run([sys.executable,'-m','pip','install','--no-index','--no-deps','--no-compile',*map(str,sorted(pathlib.Path('build/wheelhouse').glob('*.whl')))],check=True)"
      - name: DirectML provider, all-model integrity and packaging unit tests
        run: python -m pytest tests/test_directml_ocr.py tests/test_directml_windows_verification.py tests/test_release_profiles.py tests/test_home_preview_lifecycle.py tests/test_e2e_modes.py tests/test_frozen_checkout_bytes.py -q --junitxml=test-results/directml-unit.xml
      - name: Frozen models and fixtures on explicit CPU (not GPU proof)
        run: python scripts/check_directml.py --models build/native-models --provider cpu --report test-results/directml-cpu-parity.json
      - run: python scripts/install_videosubfinder.py --version 6.10.7
      - name: Package DirectML with all 15 FP32 models and original runtime notices
        run: >-
          python scripts/package_release.py --profile directml --onnx-models build/native-models
          --wheelhouse build/wheelhouse --output dist
      - name: Final DirectML ZIP with explicit CPU media tests
        run: python scripts/package_release.py --verify dist --smoke
      - name: Final DirectML ZIP in clean and contaminated host environments
        timeout-minutes: 45
        run: python scripts/verify_portable_environment.py --archives dist --output test-results/windows/portable-environment
      - run: python scripts/accept_release_archive.py --archives dist --portable-evidence test-results/windows/portable-environment
      - name: Preserve DirectML evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restored-profile-evidence-${{ matrix.os }}-directml
          path: |
            test-results/
            dist/test-results/
            dist/*.size.json
            dist/*.sha256
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve canonical original-runtime DirectML candidate
        if: matrix.os == 'windows-2022'
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-windows-x64-directml
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.zip.acceptance.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  candidate-set:
    name: Verify approved candidate matrix (not publication)
    needs: [native, windows-paddle, windows-directml, python-source]
    if: ${{ !cancelled() && needs.native.result == 'success' && needs.windows-paddle.result == 'success' && needs.windows-directml.result == 'success' && needs.python-source.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install packaging
      - uses: actions/download-artifact@v4
        with:
          pattern: release-candidate-*
          path: dist
          merge-multiple: true
      - name: Reject empty or foreign source receipt outputs before downloading
        env:
          SOURCE_ACCEPTANCE_ARTIFACT: ${{ needs.python-source.outputs.acceptance_artifact }}
          SOURCE_ACCEPTANCE_SHA256: ${{ needs.python-source.outputs.acceptance_sha256 }}
        run: |
          python -I -S - <<'PYCODE'
          import os, re
          expected = "source-acceptance-{}-{}-{}".format(os.environ["GITHUB_SHA"], os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"])
          if os.environ["SOURCE_ACCEPTANCE_ARTIFACT"] != expected or not re.fullmatch(r"[a-f0-9]{64}", os.environ["SOURCE_ACCEPTANCE_SHA256"]):
              raise SystemExit("Missing or foreign Python source acceptance output")
          PYCODE
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.python-source.outputs.acceptance_artifact }}
          path: source-acceptance
      - name: Require the complete same-run Python source receipt independently of ZIPs
        env:
          SOURCE_ACCEPTANCE_SHA256: ${{ needs.python-source.outputs.acceptance_sha256 }}
        run: >-
          python -I -S scripts/source_acceptance.py verify
          --aggregate source-acceptance/source-acceptance.json --sha256 "$SOURCE_ACCEPTANCE_SHA256"
          --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Require the exact Qt candidate plugin and complete source in the final Mac ZIP
        run: python scripts/package_macos_qt_overlay.py --archives dist
      - name: Reject missing, mislabeled, stale or unaccepted ZIPs
        run: python scripts/release_guard.py --validate-assets --sha "$GITHUB_SHA" --matrix restored-candidates --assets dist
      - name: Record compatibility and validation boundary
        shell: bash
        run: |
          {
            echo 'Seven hash-bound candidates and four same-run Python source profiles validated. No tag or GitHub release was created or modified.'
            echo 'CUDA 10.2 remains available in the immutable 2.2.0 release, not as a new PP-OCRv6 package.'
            echo 'CUDA 11.8 includes SM61 in the vendor wheel; this is not real GTX 10-series/GPU OCR certification.'
            echo 'Windows evidence covers Server 2022/2025 only. CUDA/DirectML GPU inference was not tested.'
            echo 'Mac CoreML EP execution and explicit CPU are checked in one package; physical GPU dispatch still requires separate real-device trace evidence before publication.'
          } >> "$GITHUB_STEP_SUMMARY"
