  collect:
    name: Both profiles / two Servers each / independent source-only rebuild / strict collector
    if: ${{ always() && github.repository == 'eritpchy/video-subtitle-extractor' && github.ref == 'refs/heads/fix/windows-restorer'
      }}
    needs:
    - produce-cu118
    - consume-cu118-2022
    - consume-cu118-2025
    - rebuild-cu118
    - produce-cu126
    - consume-cu126-2022
    - consume-cu126-2025
    - rebuild-cu126
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
    - name: Diagnostic driver only (separate from product source)
      uses: actions/checkout@v4
