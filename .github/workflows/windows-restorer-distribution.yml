# Diagnostic only. Exact 8f inputs; no publication, product edits, GPU or final 2.3.1 claim.
# Push acknowledgment is scoped to the already-approved fixed VC notice hashes; manual runs must confirm.
name: Exact8f native restorer same-byte distribution experiment
'on':
  push:
    branches:
    - fix/windows-restorer
    paths:
    - .github/workflows/windows-restorer-distribution.yml
    - diagnostics/windows-restorer-distribution/**
  workflow_dispatch:
    inputs:
      acknowledge_existing_redistribution_rights:
        description: Explicitly acknowledge existing reviewed VC notices/zlib redistribution rights; no new terms
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: restorer8f-distribution-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
jobs:
  produce-cu118:
    name: One production EXE / paddle-cuda11.8
    if: ${{ github.repository == 'eritpchy/video-subtitle-extractor' && github.ref == 'refs/heads/fix/windows-restorer' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.acknowledge_existing_redistribution_rights))
      }}
    runs-on: windows-2022
    timeout-minutes: 100
    outputs:
      context: ${{ steps.produce.outputs.context }}
      index_sha256: ${{ steps.produce.outputs.index_sha256 }}
      delivery_bytes: ${{ steps.produce.outputs.delivery_bytes }}
      handoff_sha256: ${{ steps.produce.outputs.handoff_sha256 }}
      delivery_artifact_id: ${{ steps.delivery.outputs.artifact-id }}
      source_artifact_id: ${{ steps.source.outputs.artifact-id }}
      raw_artifact_id: ${{ steps.raw.outputs.artifact-id }}
    steps:
    - name: Diagnostic driver only (separate from product source)
      uses: actions/checkout@v4
      with:
        path: diagnostic-driver
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /diagnostics/windows-restorer-distribution/
          /.github/workflows/windows-restorer-distribution.yml
    - name: Exact clean accepted 8f source and frozen fixtures
      uses: actions/checkout@v4
      with:
        ref: 8f08e7f6887a950f75cb7967f1f80e344935ecaa
        path: application-source
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /*
          !/backend/models/
          !/backend/subfinder/
          !/backend/ffmpeg/
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Existing build-side dependency only (not installed into the application)
      shell: python
      run: |
        import subprocess, sys
        subprocess.run([sys.executable, '-B', '-m', 'pip', 'install', '--disable-pip-version-check', 'packaging==26.3'], check=True)
    - name: Offline diagnostic contracts before large input download
      shell: python
      run: |
        import subprocess, sys
        subprocess.run([sys.executable, '-B', '-m', 'unittest', 'discover', '-s', 'diagnostic-driver/diagnostics/windows-restorer-distribution/tests', '-v'], check=True)
    - name: Verify original canonical artifact and build this profile ONCE
      id: produce
      shell: python
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VSE_WORK_NAME: restorer8f-produce-cu118
        VSE_ACKNOWLEDGE_VC_LICENSE: ${{ github.event_name == 'push' || inputs.acknowledge_existing_redistribution_rights }}
      run: |
        import os, pathlib, subprocess, sys
        driver = pathlib.Path('diagnostic-driver') / 'diagnostics/windows-restorer-distribution/driver.py'
        command = [sys.executable, '-B', str(driver.resolve()), 'produce', '--source', str(pathlib.Path('application-source').resolve()), '--work', str(pathlib.Path(os.environ['RUNNER_TEMP']) / os.environ['VSE_WORK_NAME'])]
        command += ['--profile', 'paddle-cuda11.8']
        if os.environ.get('VSE_ACKNOWLEDGE_VC_LICENSE') != 'true': raise RuntimeError('Existing redistribution rights acknowledgment required')
        command += ['--acknowledge-license']
        subprocess.run(command, check=True)
    - name: Preserve restorer8f-delivery-paddle-cuda11.8
      uses: actions/upload-artifact@v4
      with:
        name: restorer8f-delivery-paddle-cuda11.8
        path: |-
          ${{ runner.temp }}/restorer8f-produce-cu118/prepared/volumes/**
          ${{ runner.temp }}/restorer8f-produce-cu118/prepared/build/distribution/**
          ${{ runner.temp }}/restorer8f-produce-cu118/prepared/handoff.json
          ${{ runner.temp }}/restorer8f-produce-cu118/prepared/producer-context.json
          ${{ runner.temp }}/restorer8f-produce-cu118/prepared/delivery-index.json
        if-no-files-found: error
        compression-level: 0
        retention-days: 14
        include-hidden-files: true
      id: delivery
    - name: Preserve restorer8f-source-paddle-cuda11.8
      uses: actions/upload-artifact@v4
      with:
        name: restorer8f-source-paddle-cuda11.8
        path: |-
          ${{ runner.temp }}/restorer8f-produce-cu118/prepared/build/distribution/restorer-source.zip
        if-no-files-found: error
        compression-level: 0
        retention-days: 14
        include-hidden-files: true
      id: source
    - name: Preserve restorer8f-producer-raw-paddle-cuda11.8
      uses: actions/upload-artifact@v4
      with:
        name: restorer8f-producer-raw-paddle-cuda11.8
        path: |-
          ${{ runner.temp }}/restorer8f-produce-cu118/*.json
          ${{ runner.temp }}/restorer8f-produce-cu118/*.log
          ${{ runner.temp }}/restorer8f-produce-cu118/prepared/*.json
          ${{ runner.temp }}/restorer8f-produce-cu118/prepared/*.log
          ${{ runner.temp }}/restorer8f-produce-cu118/prepared/build/*.json
          ${{ runner.temp }}/restorer8f-produce-cu118/prepared/build/*.log
          ${{ runner.temp }}/restorer8f-produce-cu118/prepared/build/*.txt
          ${{ runner.temp }}/restorer8f-produce-cu118/prepared/build/*.hpp
        if-no-files-found: error
        compression-level: 0
        retention-days: 14
        include-hidden-files: true
      id: raw
      if: always()
  consume-cu118-2022:
    name: Same producer EXE / paddle-cuda11.8 / windows-2022
    needs:
    - produce-cu118
    runs-on: windows-2022
    timeout-minutes: 240
    outputs:
      report_sha256: ${{ steps.consume.outputs.report_sha256 }}
