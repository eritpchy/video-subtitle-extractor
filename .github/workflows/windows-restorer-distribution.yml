# Local preparation: explicit final input binding; no publication or GPU claim.
# Manual only. Missing pins or explicit rights acknowledgment fail closed; push never grants rights.
name: Bound final CUDA restorer same-byte distribution validation
'on':
  workflow_dispatch:
    inputs:
      acknowledge_vc_redistribution_license:
        description: Explicitly confirm applicable existing redistribution rights for these bound final inputs; not legal verification
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: restorer-final-distribution-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
jobs:
  produce-cu118:
    # Job-scoped command configuration precedes checkout; no global/repository settings are written.
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    name: One production EXE / paddle-cuda11.8
    if: ${{ github.repository == 'eritpchy/video-subtitle-extractor' && github.ref == 'refs/heads/fix/windows-restorer' &&
      (github.event_name == 'workflow_dispatch' && inputs.acknowledge_vc_redistribution_license)
      }}
    runs-on: windows-2022
    timeout-minutes: 100
    outputs:
      context: ${{ steps.produce.outputs.context }}
      index_sha256: ${{ steps.produce.outputs.index_sha256 }}
      delivery_bytes: ${{ steps.produce.outputs.delivery_bytes }}
      handoff_sha256: ${{ steps.produce.outputs.handoff_sha256 }}
      delivery_artifact_id: ${{ steps.delivery.outputs.artifact-id }}
      source_artifact_id: ${{ steps.source.outputs.artifact-id }}
      raw_artifact_id: ${{ steps.raw.outputs.artifact-id }}
    steps:
    - name: Diagnostic driver only (separate from product source)
      uses: actions/checkout@v4
      with:
        path: diagnostic-driver
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /diagnostics/windows-restorer-distribution/
          /.github/workflows/windows-restorer-distribution.yml
    - name: Exact clean bound final source and frozen fixtures
      uses: actions/checkout@v4
      with:
        ref: 2720ab309cdbce3c63bc9a7e2748930f3c1cafec
        path: application-source
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /*
          !/backend/models/
          !/backend/subfinder/
          !/backend/ffmpeg/
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Authenticate canonical Git source bytes before contracts or compilation
      shell: python
      run: |
        import pathlib, subprocess, sys
        driver = pathlib.Path('diagnostic-driver/diagnostics/windows-restorer-distribution/driver.py').resolve()
        subprocess.run([sys.executable, '-I', '-S', '-B', str(driver), 'canonical-source',
                        '--source', str(pathlib.Path('application-source').resolve()),
                        '--audit', str(pathlib.Path('source-checkout-git-audit.json').resolve())], check=True)
    - name: Existing build-side dependency only (not installed into the application)
      shell: python
      run: |
        import subprocess, sys
        subprocess.run([sys.executable, '-B', '-m', 'pip', 'install', '--disable-pip-version-check', 'packaging==26.3'], check=True)
    - name: Offline diagnostic contracts before large input download
      shell: python
      run: |
        import subprocess, sys
        subprocess.run([sys.executable, '-B', '-m', 'unittest', 'discover', '-s', 'diagnostic-driver/diagnostics/windows-restorer-distribution/tests', '-v'], check=True)
    - name: Verify original canonical artifact and build this profile ONCE
      id: produce
      shell: python
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VSE_WORK_NAME: restorer-final-produce-cu118
        VSE_ACKNOWLEDGE_VC_LICENSE: ${{ inputs.acknowledge_vc_redistribution_license }}
      run: |
        import os, pathlib, subprocess, sys
        driver = pathlib.Path('diagnostic-driver') / 'diagnostics/windows-restorer-distribution/driver.py'
        command = [sys.executable, '-B', str(driver.resolve()), 'produce', '--source', str(pathlib.Path('application-source').resolve()), '--work', str(pathlib.Path(os.environ['RUNNER_TEMP']) / os.environ['VSE_WORK_NAME'])]
        command += ['--profile', 'paddle-cuda11.8']
        if os.environ.get('VSE_ACKNOWLEDGE_VC_LICENSE') != 'true': raise RuntimeError('Existing redistribution rights acknowledgment required')
        command += ['--acknowledge-license']
        subprocess.run(command, check=True)
    - name: Preserve restorer-final-delivery-paddle-cuda11.8
      uses: actions/upload-artifact@v4
      with:
        name: restorer-final-delivery-paddle-cuda11.8
        path: |-
          ${{ runner.temp }}/restorer-final-produce-cu118/prepared/volumes/**
          ${{ runner.temp }}/restorer-final-produce-cu118/prepared/build/distribution/**
          ${{ runner.temp }}/restorer-final-produce-cu118/prepared/handoff.json
          ${{ runner.temp }}/restorer-final-produce-cu118/prepared/producer-context.json
          ${{ runner.temp }}/restorer-final-produce-cu118/prepared/delivery-index.json
        if-no-files-found: error
        compression-level: 0
        retention-days: 14
        include-hidden-files: true
      id: delivery
    - name: Preserve restorer-final-source-paddle-cuda11.8
      uses: actions/upload-artifact@v4
      with:
        name: restorer-final-source-paddle-cuda11.8
        path: |-
          ${{ runner.temp }}/restorer-final-produce-cu118/prepared/build/distribution/restorer-source.zip
        if-no-files-found: error
        compression-level: 0
        retention-days: 14
        include-hidden-files: true
      id: source
    - name: Preserve restorer-final-producer-raw-paddle-cuda11.8
      uses: actions/upload-artifact@v4
      with:
        name: restorer-final-producer-raw-paddle-cuda11.8
        path: |-
          ${{ runner.temp }}/restorer-final-produce-cu118/*.json
          ${{ runner.temp }}/restorer-final-produce-cu118/*.log
          ${{ runner.temp }}/restorer-final-produce-cu118/prepared/*.json
          ${{ runner.temp }}/restorer-final-produce-cu118/prepared/*.log
          ${{ runner.temp }}/restorer-final-produce-cu118/prepared/build/*.json
          ${{ runner.temp }}/restorer-final-produce-cu118/prepared/build/*.log
          ${{ runner.temp }}/restorer-final-produce-cu118/prepared/build/*.txt
          ${{ runner.temp }}/restorer-final-produce-cu118/prepared/build/*.hpp
        if-no-files-found: error
        compression-level: 0
        retention-days: 14
        include-hidden-files: true
      id: raw
      if: always()
  consume-cu118-2022:
    name: Same producer EXE / paddle-cuda11.8 / windows-2022
    needs:
    - produce-cu118
    runs-on: windows-2022
    timeout-minutes: 240
    outputs:
