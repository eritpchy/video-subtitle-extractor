        path: ${{ runner.temp }}/restorer8f-reports/paddle-cuda12.6-source
    - name: Hard gate every upstream result, original report SHA, and full transported parts again
      if: always()
      shell: python
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VSE_NEEDS: ${{ toJSON(needs) }}
      run: |
        import importlib.util, os, pathlib, sys
        sys.dont_write_bytecode = True
        path = pathlib.Path('diagnostic-driver/diagnostics/windows-restorer-distribution/driver.py').resolve()
        spec = importlib.util.spec_from_file_location('_distribution_collector_entry', path)
