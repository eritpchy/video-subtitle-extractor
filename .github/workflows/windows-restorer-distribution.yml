    - name: Exact clean bound final source and frozen fixtures
      uses: actions/checkout@v4
      with:
        ref: 2720ab309cdbce3c63bc9a7e2748930f3c1cafec
        path: application-source
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /*
          !/backend/models/
          !/backend/subfinder/
          !/backend/ffmpeg/
    - uses: actions/setup-python@v5
      with:
