    - name: Exact clean accepted 8f source and frozen fixtures
      uses: actions/checkout@v4
      with:
        ref: 8f08e7f6887a950f75cb7967f1f80e344935ecaa
        path: application-source
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /*
          !/backend/models/
          !/backend/subfinder/
          !/backend/ffmpeg/
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Existing build-side dependency only (not installed into the application)
      shell: python
      run: |
        import subprocess, sys
        subprocess.run([sys.executable, '-B', '-m', 'pip', 'install', '--disable-pip-version-check', 'packaging==26.3'], check=True)
    - name: Consume identical producer EXE; original launcher / two environments / 168 CPU cases / three videos
      id: consume
      shell: python
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VSE_WORK_NAME: restorer8f-consume-cu118-2022
        VSE_CONTEXT: ${{ needs.produce-cu118.outputs.context }}
        VSE_INDEX_SHA256: ${{ needs.produce-cu118.outputs.index_sha256 }}
        VSE_ARTIFACT_ID: ${{ needs.produce-cu118.outputs.delivery_artifact_id }}
        VSE_DELIVERY_BYTES: ${{ needs.produce-cu118.outputs.delivery_bytes }}
      run: |
        import os, pathlib, subprocess, sys
        driver = pathlib.Path('diagnostic-driver') / 'diagnostics/windows-restorer-distribution/driver.py'
        command = [sys.executable, '-B', str(driver.resolve()), 'consume', '--source', str(pathlib.Path('application-source').resolve()), '--work', str(pathlib.Path(os.environ['RUNNER_TEMP']) / os.environ['VSE_WORK_NAME'])]
        command += ['--profile', 'paddle-cuda11.8']
        command += ['--runner', 'windows-2022', '--context', os.environ['VSE_CONTEXT'], '--index-sha256', os.environ['VSE_INDEX_SHA256'], '--artifact-id', os.environ['VSE_ARTIFACT_ID'], '--delivery-bytes', os.environ['VSE_DELIVERY_BYTES']]
        subprocess.run(command, check=True)
    - name: Preserve restorer8f-report-paddle-cuda11.8-windows-2022
      uses: actions/upload-artifact@v4
      with:
        name: restorer8f-report-paddle-cuda11.8-windows-2022
        path: |-
          ${{ runner.temp }}/restorer8f-consume-cu118-2022/acceptance/consumer-report.json
        if-no-files-found: error
        compression-level: 0
        retention-days: 14
        include-hidden-files: true
      id: report
      if: always()
    - name: Preserve restorer8f-consumer-raw-paddle-cuda11.8-windows-2022
      uses: actions/upload-artifact@v4
      with:
        name: restorer8f-consumer-raw-paddle-cuda11.8-windows-2022
        path: |-
          ${{ runner.temp }}/restorer8f-consume-cu118-2022/*.json
          ${{ runner.temp }}/restorer8f-consume-cu118-2022/*.log
          ${{ runner.temp }}/restorer8f-consume-cu118-2022/acceptance/*.json
          ${{ runner.temp }}/restorer8f-consume-cu118-2022/acceptance/*.log
          ${{ runner.temp }}/restorer8f-consume-cu118-2022/acceptance/launcher-evidence/**
        if-no-files-found: error
        compression-level: 0
        retention-days: 14
        include-hidden-files: true
