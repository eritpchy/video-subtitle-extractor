    name: Independent source ZIP only / paddle-cuda12.6
    needs:
    - produce-cu126
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      report_sha256: ${{ steps.rebuild.outputs.report_sha256 }}
